<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Banking App Home</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7fc;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .account-info {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .account-info h2 {
            margin: 0;
        }

        .account-balance {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .button-group {
            margin-top: 20px;
            text-align: center;
        }

        .button-group a {
            text-decoration: none;
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 10px;
            transition: background-color 0.3s;
        }

        .button-group a:hover {
            background-color: #004d99;
        }

        footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Your Banking App</h1>
    </header>

    <div class="container">
        <div class="account-info">
            <h2>Hello, John Doe!</h2>
            <p>Account Number: 1234 5678 9876 5432</p>
            <p class="account-balance">Balance: $5,000.00</p>
        </div>

        <div class="button-group">
            <a href="#">Transfer Money</a>
            <a href="#">Transaction History</a>
            <a href="#">Account Settings</a>
            <a href="#">Logout</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 BankingApp. All rights reserved.</p>
    </footer>

</body>
</html>
